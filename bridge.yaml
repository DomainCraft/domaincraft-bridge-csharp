name: csharp-restful
description: C# REST API bridge for DomainCraft (EF Core + PostgreSQL + JWT)
version: "1.0.0"
output_dir: generated
helpers: templates/_helpers.cs.tmpl

# Package registry URL for auto-resolving versions. {id} is replaced with lowercase package ID.
# Returns JSON: {"versions": ["1.0.0", "1.0.1", ...]}
registry_url: "https://api.nuget.org/v3-flatcontainer/{id}/index.json"

# Maps logical package key → registry package ID.
# Used to auto-resolve latest stable versions from the package registry.
registry_packages:
  ef_core: Microsoft.EntityFrameworkCore
  ef_core_design: Microsoft.EntityFrameworkCore.Design
  ef_core_relational: Microsoft.EntityFrameworkCore.Relational
  npgsql_ef: Npgsql.EntityFrameworkCore.PostgreSQL
  logging_abstractions: Microsoft.Extensions.Logging.Abstractions
  di_abstractions: Microsoft.Extensions.DependencyInjection.Abstractions
  dapr: Dapr.AspNetCore
  jwt_bearer: Microsoft.AspNetCore.Authentication.JwtBearer
  identity_model: Microsoft.IdentityModel.Tokens
  swashbuckle: Swashbuckle.AspNetCore
  swashbuckle_annotations: Swashbuckle.AspNetCore.Annotations
  healthchecks_npgsql: AspNetCore.HealthChecks.NpgSql
  json_serialization: System.Text.Json
  di_extensions: Microsoft.Extensions.DependencyInjection
  test_sdk: Microsoft.NET.Test.Sdk
  xunit: xunit
  xunit_runner: xunit.runner.visualstudio
  ef_core_inmemory: Microsoft.EntityFrameworkCore.InMemory
  mvc_testing: Microsoft.AspNetCore.Mvc.Testing
  testcontainers: Testcontainers.PostgreSql
  npgsql: Npgsql
  hangfire: Hangfire
  hangfire_postgresql: Hangfire.PostgreSql
  versioning: Asp.Versioning.Mvc
  versioning_api_explorer: Asp.Versioning.Mvc.ApiExplorer
  bcrypt: BCrypt.Net-Next
  serilog: Serilog.AspNetCore
  serilog_settings: Serilog.Settings.Configuration
  serilog_seq: Serilog.Sinks.Seq
  serilog_console: Serilog.Sinks.Console
  otel_hosting: OpenTelemetry.Extensions.Hosting
  otel_aspnetcore: OpenTelemetry.Instrumentation.AspNetCore
  otel_jaeger: OpenTelemetry.Exporter.Jaeger

# Database migrations. The core CLI runs these in order from the generated output
# directory ONLY when invoked with `domaincraft generate --migrate`, so applying
# schema changes to a real database stays an explicit, opt-in step. The developer
# never has to think about SQL — this bridge owns it via EF Core tooling.
migrations:
  enabled: true
  commands:
    - "dotnet ef migrations add InitialCreate --project src/Infrastructure --startup-project src/WebApi --output-dir Persistence/Migrations"
    - "dotnet ef database update --project src/Infrastructure --startup-project src/WebApi"

# Supported configurations
supports:
  - api_style: rest
  - database: postgresql
  - auth: jwt
  - multi_tenancy: "none"

templates:
  # ===== DOMAIN ENTITIES & SHARED =====
  - for: entity
    source: templates/entity.cs.tmpl
    target: "src/Domain/Entities/{{ .Entity.Name }}.cs"

  - for: project
    source: templates/enums.cs.tmpl
    target: "src/Domain/Shared/Enums.cs"
    when: hasEnums

  - for: project
    source: templates/PagedResult.cs.tmpl
    target: "src/Domain/Shared/PagedResult.cs"

  # ===== INFRASTRUCTURE PERSISTENCE =====
  - for: project
    source: templates/dbcontext.cs.tmpl
    target: "src/Infrastructure/Persistence/DomainDbContext.cs"

  - for: entity
    source: templates/entity-configuration.cs.tmpl
    target: "src/Infrastructure/Persistence/Configurations/{{ .Entity.Name }}Configuration.cs"

  - for: project
    source: templates/seed-seeder.cs.tmpl
    target: "src/Infrastructure/Persistence/Seeders/DomainSeeder.cs"
    when: hasSeed

  # ===== APPLICATION REPOSITORIES (interfaces) =====
  - for: entity
    source: templates/irepository.cs.tmpl
    target: "src/Application/Repositories/I{{ .Entity.Name }}Repository.cs"

  - for: project
    source: templates/irepository-base.cs.tmpl
    target: "src/Application/Repositories/IRepository.cs"

  # ===== INFRASTRUCTURE REPOSITORIES (EF Core implementations) =====
  - for: entity
    source: templates/repository-impl.cs.tmpl
    target: "src/Infrastructure/Repositories/{{ .Entity.Name }}Repository.cs"

  - for: project
    source: templates/infrastructure-di.cs.tmpl
    target: "src/Infrastructure/DependencyInjection.cs"

  # ===== APPLICATION HANDLERS / SERVICES =====
  - for: project
    source: templates/permissions.cs.tmpl
    target: "src/Application/Security/PermissionPolicies.cs"
    when: hasPermissions

  - for: project
    source: templates/IPermissionService.cs.tmpl
    target: "src/Application/Security/IPermissionService.cs"

  - for: project
    source: templates/PermissionService.cs.tmpl
    target: "src/Application/Security/PermissionService.cs"

  - for: project
    source: templates/IOwnerResolver.cs.tmpl
    target: "src/Application/Security/IOwnerResolver.cs"

  - for: project
    source: templates/OwnerResolver.cs.tmpl
    target: "src/Application/Security/OwnerResolver.cs"

  - for: project
    source: templates/IPasswordHasher.cs.tmpl
    target: "src/Application/Security/IPasswordHasher.cs"
    when: hasAuth

  - for: project
    source: templates/BcryptPasswordHasher.cs.tmpl
    target: "src/Infrastructure/Security/BcryptPasswordHasher.cs"
    when: hasAuth

  # ===== APPLICATION SERVICES (Generation Gap: Core + Custom) =====
  # The service layer uses C# partial classes: the generated part below is always
  # overwritten, the custom part (overwrite: false) is scaffolded once and owned by
  # the developer. Implement the partial hooks there to keep custom business logic
  # safe across regenerations.
  - for: project
    source: templates/service-hooks.cs.tmpl
    target: "src/Application/Services/ServiceHooks.cs"

  - for: entity
    source: templates/iservice.cs.tmpl
    target: "src/Application/Services/I{{ .Entity.Name }}Service.cs"

  - for: entity
    source: templates/generated-service.cs.tmpl
    target: "src/Application/Generated/{{ .Entity.Name }}Service.g.cs"

  - for: entity
    source: templates/custom-service.cs.tmpl
    target: "src/Application/Services/{{ .Entity.Name }}Service.cs"
    overwrite: false

  - for: project
    source: templates/service-registration.cs.tmpl
    target: "src/Application/DependencyInjection.cs"

  # ===== AUTH SERVICE (Generation Gap: Core + Custom) =====
  # The auth flow (login/register/me) lives in an IAuthService port so the auth
  # controller never touches DomainDbContext directly — same pattern as the
  # per-entity I{Entity}Service. The generated part is overwritten every run;
  # the custom part (overwrite: false) is scaffolded once for business hooks.
  - for: project
    source: templates/iauth-service.cs.tmpl
    target: "src/Application/Services/IAuthService.cs"
    when: hasAuth

  - for: project
    source: templates/generated-auth-service.cs.tmpl
    target: "src/Application/Generated/AuthService.g.cs"
    when: hasAuth

  - for: project
    source: templates/custom-auth-service.cs.tmpl
    target: "src/Application/Services/AuthService.cs"
    when: hasAuth
    overwrite: false

  # ===== CACHING =====
  # Redis is intentionally NOT referenced. Caching is either in-process
  # (InMemoryCacheService) or, with the dapr addon, through Dapr state management
  # (DaprCacheService → dapr/components/statestore.yaml).
  - for: project
    source: templates/icache-service.cs.tmpl
    target: "src/Application/Caching/ICacheService.cs"

  - for: project
    source: templates/InMemoryCacheService.cs.tmpl
    target: "src/Infrastructure/Caching/InMemoryCacheService.cs"
    when: notHasAddon:dapr

  - for: project
    source: templates/DaprCacheService.cs.tmpl
    target: "src/Infrastructure/Caching/DaprCacheService.cs"
    when: hasAddon:dapr

  # ===== EMAIL (port + implementations) =====
  - for: project
    source: templates/IEmailService.cs.tmpl
    target: "src/Application/Email/IEmailService.cs"

  - for: project
    source: templates/InMemoryEmailService.cs.tmpl
    target: "src/Infrastructure/Email/InMemoryEmailService.cs"
    when: notHasAddon:dapr

  - for: project
    source: templates/DaprEmailService.cs.tmpl
    target: "src/Infrastructure/Email/DaprEmailService.cs"
    when: hasAddon:dapr

  # ===== STORAGE (port + implementations) =====
  # Objects/files are always exposed through IStorageService. The default local
  # implementation keeps them on disk; with --addons dapr the same keys route
  # through the Dapr storage output binding (local/S3/Blob/GCS) so providers swap
  # without changing application code.
  - for: project
    source: templates/IStorageService.cs.tmpl
    target: "src/Application/Storage/IStorageService.cs"

  - for: project
    source: templates/LocalFileStorageService.cs.tmpl
    target: "src/Infrastructure/Storage/LocalFileStorageService.cs"
    when: notHasAddon:dapr

  - for: project
    source: templates/DaprStorageService.cs.tmpl
    target: "src/Infrastructure/Storage/DaprStorageService.cs"
    when: hasAddon:dapr

  # ===== EVENT PUBLISHING (port + implementations) =====
  # The IEventPublisher interface is always generated; the concrete publisher is
  # selected at DI time based on whether the project is generated with --addons dapr.
  - for: project
    source: templates/IEventPublisher.cs.tmpl
    target: "src/Application/Events/IEventPublisher.cs"

  - for: project
    source: templates/InMemoryEventPublisher.cs.tmpl
    target: "src/Infrastructure/Events/InMemoryEventPublisher.cs"
    when: notHasAddon:dapr

  - for: project
    source: templates/DaprEventPublisher.cs.tmpl
    target: "src/Infrastructure/Events/DaprEventPublisher.cs"
    when: hasAddon:dapr

  # ===== DAPR COMPONENT MANIFESTS (only when the dapr addon is enabled) =====
  - for: project
    source: templates/dapr-components/pubsub.yaml.tmpl
    target: "dapr/components/pubsub.yaml"
    when: hasAddon:dapr

  - for: project
    source: templates/dapr-components/statestore.yaml.tmpl
    target: "dapr/components/statestore.yaml"
    when: hasAddon:dapr

  - for: project
    source: templates/dapr-components/email.yaml.tmpl
    target: "dapr/components/email.yaml"
    when: hasAddon:dapr

  - for: project
    source: templates/dapr-components/storage.yaml.tmpl
    target: "dapr/components/storage.yaml"
    when: hasAddon:dapr

  # ===== HEALTH CHECKS =====
  - for: project
    source: templates/health-checks.cs.tmpl
    target: "src/WebApi/HealthChecks/HealthCheckResponseWriter.cs"

  # ===== REST API CONTROLLERS =====
  - for: entity
    source: templates/controller.cs.tmpl
    target: "src/WebApi/Controllers/{{ pluralize .Entity.Name }}Controller.cs"

  - for: project
    source: templates/auth-controller.cs.tmpl
    target: "src/WebApi/Controllers/{{ .Project.Auth.Entity }}Controller.cs"
    when: hasAuth

  # ===== PROJECT FILES =====
  - for: project
    source: templates/domain.csproj.tmpl
    target: "src/Domain/Domain.csproj"

  - for: project
    source: templates/infrastructure.csproj.tmpl
    target: "src/Infrastructure/Infrastructure.csproj"

  - for: project
    source: templates/application.csproj.tmpl
    target: "src/Application/Application.csproj"

  - for: project
    source: templates/webapi.csproj.tmpl
    target: "src/WebApi/WebApi.csproj"

  - for: project
    source: templates/Program.cs.tmpl
    target: "src/WebApi/Program.cs"
    # Developer-owned: Program.cs is the single host entry point where you add
    # custom middleware, policies and pipeline tweaks. Marking it overwrite:false
    # means a regeneration never clobbers those edits. When you DO want the
    # generator's Program.cs updates to land, delete the file and regenerate.
    overwrite: false

  - for: project
    source: templates/appsettings.json.tmpl
    target: "src/WebApi/appsettings.json"

  - for: project
    source: templates/appsettings.Development.json.tmpl
    target: "src/WebApi/appsettings.Development.json"

  - for: project
    source: templates/appsettings.Staging.json.tmpl
    target: "src/WebApi/appsettings.Staging.json"

  - for: project
    source: templates/appsettings.Production.json.tmpl
    target: "src/WebApi/appsettings.Production.json"

  # ===== DOCUMENTATION =====
  - for: entity
    source: templates/entity-summary.md.tmpl
    target: "docs/Entities/{{ .Entity.Name }}.md"

  - for: project
    source: templates/project-summary.md.tmpl
    target: "docs/ProjectSummary.md"

  - for: project
    source: templates/solution.sln.tmpl
    target: "{{ .Project.Name | pascalcase }}.sln"

  # ===== TESTS =====
  # Integration test suite is split by concern across several partial-class files:
  # ApiTests.cs  - fixture, container, seeding, health check
  # AuthTests.cs - auth flow (register/login/me/duplicate)
  # EntityTests.cs - per-entity CRUD authorization matrix
  # EntityStateTests.cs - role-based 403, 400 invalid body, authenticated CRUD, concurrency
  - for: project
    source: templates/tests.ApiTests.cs.tmpl
    target: "tests/ApiTests.cs"

  - for: project
    source: templates/tests.AuthTests.cs.tmpl
    target: "tests/AuthTests.cs"

  - for: project
    source: templates/tests.EntityTests.cs.tmpl
    target: "tests/EntityTests.cs"

  - for: project
    source: templates/tests.EntityStateTests.cs.tmpl
    target: "tests/EntityStateTests.cs"

  - for: project
    source: templates/tests.csproj.tmpl
    target: "tests/{{ .Project.Name | pascalcase }}.Tests.csproj"

  # ===== DOCKER =====
  - for: project
    source: templates/Dockerfile.tmpl
    target: "Dockerfile"

  - for: project
    source: templates/docker-compose.yml.tmpl
    target: "docker-compose.yml"

  # ===== DEPLOYMENT (Kubernetes) =====
  - for: project
    source: templates/k8s/deployment.yaml.tmpl
    target: "deploy/k8s/deployment.yaml"

  - for: project
    source: templates/k8s/service.yaml.tmpl
    target: "deploy/k8s/service.yaml"

  - for: project
    source: templates/k8s/ingress.yaml.tmpl
    target: "deploy/k8s/ingress.yaml"
